name: Build Check

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

env:
  GRADLE_VERSION: "8.14.5"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check for stub markers
        run: |
          if grep -rnE "TODO|FIXME|// ?stub|not.?implemented" --include="*.kt" app/src/main/java; then
            echo "::error::Stub markers found in source marked as complete. See lines above."
            exit 1
          else
            echo "No stub markers found."
          fi

      - name: Run tests and lint
        run: gradle check lint --continue

      - name: Build debug APK
        run: gradle assembleDebug
